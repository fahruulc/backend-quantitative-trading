services:
  redis:
    image: redis:7-alpine
    container_name: quant_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  api:
    build: .
    container_name: quant_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Menimpa REDIS_URL di .env agar backend mengarah ke container redis (quant_redis)
      - REDIS_URL=redis://quant_redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
